name: Build & Push ML Engine to ECR

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "training/**"
      - "migrations/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Compute variant to build & publish"
        required: true
        default: "stage-cpu"
        type: choice
        options:
          - stage-cpu
          - prod-gpu

permissions:
  id-token: write
  contents: read

concurrency:
  group: ecr-ml-${{ github.event.inputs.target || 'stage-cpu' }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  AWS_ROLE_ARN: arn:aws:iam::226259226741:role/growroute-github-ecr-push-role
  ECR_REPOSITORY: growroute-ml-engine

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk space for CUDA GPU builds
        if: ${{ github.event.inputs.target == 'prod-gpu' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure models directory exists for Docker context
        run: mkdir -p models

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve Dockerfile and tags
        id: meta
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          TARGET="${{ github.event.inputs.target || 'stage-cpu' }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [ "$TARGET" = "prod-gpu" ]; then
            echo "dockerfile=./Dockerfile.gpu" >> "$GITHUB_OUTPUT"
            echo "scope=ml-gpu" >> "$GITHUB_OUTPUT"
            echo "tags=${REGISTRY}/${ECR_REPOSITORY}:prod,${REGISTRY}/${ECR_REPOSITORY}:prod-gpu,${REGISTRY}/${ECR_REPOSITORY}:gpu-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "dockerfile=./Dockerfile.cpu" >> "$GITHUB_OUTPUT"
            echo "scope=ml-cpu" >> "$GITHUB_OUTPUT"
            echo "tags=${REGISTRY}/${ECR_REPOSITORY}:stage,${REGISTRY}/${ECR_REPOSITORY}:stage-cpu,${REGISTRY}/${ECR_REPOSITORY}:cpu-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.scope }}