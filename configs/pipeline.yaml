run_id: "yolo-dfw-v1"
model:
  weights_pt: "models/pool_spa_dfw_v2.pt"
  weights_onnx: "models/pool_spa_dfw_v2.onnx"
  imgsz: 640
  conf_threshold: 0.45
  iou_threshold: 0.50
  hard_negative_range: [0.25, 0.44]  # Auto-saved for Texas v2 retraining

storage:
  s3_bucket: "growroute-naip-tiles"
  s3_prefix: "tx/h3_res9"
  local_cache_dir: "./tiles_cache"
  runs_dir: "./runs"
  file_ext: ".tif"
  
classes:
  0: "pool"
  1: "spa"

canopy:
  buffer_meters: 15.0                # 15m leaf-drop ring around detected pool
  overhang_threshold_pct: 35.0       # Sets tree_overhang = true when >= 35%

s3:
  bucket: "growroute-naip-tiles"
  prefix: "tx/h3_res9"